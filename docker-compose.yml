services:
  flowery:
    build: .
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      APP_SECRET: ${APP_SECRET:-change-this-secret-before-production}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-demo-partner-key}
      DATABASE_PATH: /app/server/data/flowery.db
    volumes:
      - flowery-data:/app/server/data
    restart: unless-stopped

volumes:
  flowery-data:
