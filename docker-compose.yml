services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: flowery
      MYSQL_USER: flowery_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-database-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-root-password}
      TZ: Asia/Ho_Chi_Minh
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - flowery-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change-this-root-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  flowery:
    build: .
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      APP_SECRET: ${APP_SECRET:-change-this-secret-before-production}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-demo-partner-key}
      DB_CLIENT: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: flowery
      MYSQL_USER: flowery_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-database-password}
      MYSQL_SSL: "false"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  flowery-mysql-data:

